
name: Atualizar card de linguagens

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-card-linguagens
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o verificador
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Sincronizar repositorio
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Gerar card
        run: node atualizar-linguagens.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar SVG atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add languages.svg

          if git diff --cached --quiet; then
            echo "O card nao mudou."
            exit 0
          fi

          git commit -m "Atualiza card de linguagens"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
